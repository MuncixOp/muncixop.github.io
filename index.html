<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MUNCIX_OP // HYPER_VOID KERNEL v25.0-ULTIMATE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="scanlines"></div>
    <div class="bg-grid"></div>
    <canvas id="matrixCanvas"></canvas>
    <div class="vignette-overlay"></div>
    <div class="corrupt-flash" id="corruptFlash"></div>
    <div class="screen-glitch-overlay" id="screenGlitchOverlay"></div>
    <div class="vhs-tracking-line" id="vhsTracking"></div>

    <div id="bootScreen">
        <div class="boot-header-info">
            <span>MUNCIX-BIOS UEFI v25.09.12-HYPER</span>
            <span>ARCH: x86_64-QUANTUM-HYPERCORE-V2</span>
            <span>STATUS: HARDWARE COLD BOOT ACTIVE</span>
        </div>
        <div class="boot-log" id="bootLog">INITIALIZING SYSTEM HARDWARE ABSTRACTION LAYERS...</div>
        <div class="boot-progress-container">
            <div class="boot-progress-bar" id="bootProgressBar"></div>
        </div>
        <div class="boot-footer-status" id="bootFooterStatus">LOADING KERNEL MODULES...</div>
    </div>

    <div id="terminalContainer"></div>

    <script src="main.js"></script>
</body>
</html>
