<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOID SYSTEMS - Kernel v7.2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="scanlines"></div>
    <div class="bg-grid"></div>
    <canvas id="matrixCanvas"></canvas>

    <div id="bootScreen">
        <div class="boot-log" id="bootLog">INITIALIZING VOID KERNEL BOOT SEQUENCE...</div>
    </div>

    <div class="terminal-window constant-jitter spawning" id="mainTerminal" style="top: 50%; left: 50%; transform: translate(-50%, -50%);">
        <div class="terminal-header" data-window-id="mainTerminal">
            <div class="window-controls">
                <button class="control-btn btn-close" id="mainCloseBtn" title="Close"></button>
                <button class="control-btn btn-minimize" id="mainMinBtn" title="Minimize"></button>
                <button class="control-btn btn-maximize" id="mainMaxBtn" title="Maximize"></button>
            </div>
            <div class="terminal-title">
                <span>VOID_OS</span> // CORE_TERMINAL
            </div>
            <div class="window-status">PID: 101</div>
        </div>

        <div class="terminal-body" id="mainTerminalBody">
            <div class="output-line system">VOID KERNEL [Version 7.2.0-STABLE]</div>
            <div class="output-line system">Type 'help' to list available system commands or interface controls.</div>
            <div class="output-line" style="margin-bottom: 10px;">----------------------------------------------------------------</div>
            
            <div id="mainOutputContainer"></div>

            <div class="input-line">
                <span class="prompt">root@void:~#</span>
                <input type="text" id="mainCommandInput" class="command-input" autocomplete="off" spellcheck="false">
            </div>
        </div>

        <div class="terminal-footer-hint">
            <span>SECURE KERNEL ACTIVE</span>
            <span>UTF-8</span>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
