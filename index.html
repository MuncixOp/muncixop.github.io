<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TERMINAL_ACCESS</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Canvas para el efecto glitch (no intrusivo) -->
  <canvas id="glitch-canvas"></canvas>
  
  <!-- Contenedor principal centrado con Grid -->
  <div class="terminal">
    <!-- Pantalla de carga rápida -->
    <div id="boot" class="hidden">
      <div class="line"><span class="prompt">root@sys:~$</span> init...</div>
      <div class="line">loading modules...</div>
      <div class="line">mounting /dev/null...</div>
      <div class="line" style="color:#0f0">SYSTEM READY.</div>
    </div>

    <!-- Contenido Principal -->
    <div id="main" class="hidden">
      <pre class="ascii">
   _____  __  __ 
  /  _  \|  \/  |
  |  /|  ||      |
  |_/ |__||_|\_/|
      </pre>
      
      <div class="info">
        <div>USR: <span class="hl">GUEST</span></div>
        <div>IP: <span class="hl">192.168.X.X</span></div>
        <div>ST: <span class="blink">ONLINE</span></div>
      </div>

      <div class="nav">
        <!-- ⚡ CAMBIA LOS LINKS AQUÍ -->
        <a href="#" class="lnk"><span class="ic">[G]</span> GitHub</a>
        <a href="#" class="lnk"><span class="ic">[T]</span> Twitter</a>
        <a href="#" class="lnk"><span class="ic">[L]</span> LinkedIn</a>
        <a href="#" class="lnk"><span class="ic">[M]</span> Mail</a>
      </div>

      <div class="stats">
        <div>CPU: <span id="cpu">0</span>%</div>
        <div>RAM: <span id="ram">0</span>%</div>
        <div>UPT: <span id="up">00:00</span></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
