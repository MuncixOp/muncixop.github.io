<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#060606">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="VOID">
<meta name="description" content="MuncixOp — Creative Developer & UI Engineer.">
<meta name="format-detection" content="telephone=no">
<title>~/muncixop — VOID SYSTEMS</title>

<!-- CSS CRÍTICO INLINE — siempre se aplica, aunque style.css falle -->
<style>
  html,body{margin:0;padding:0;background:#060606;color:#c8c8cc;height:100%;overflow:hidden;font-family:'SF Mono','Menlo','Fira Code','Consolas',monospace;}
  body{--accent:#3ddc84;--accent-rgb:61,220,132;--accent-2:#5eaaff;}
  #c,#p{position:fixed;inset:0;pointer-events:none;}
  #c{opacity:.05;z-index:0}
  #p{opacity:.55;z-index:1}
  #wins{position:fixed;inset:0;z-index:2}
  .win{position:absolute;background:#141416;border-radius:12px;box-shadow:0 8px 24px #00000070;display:flex;flex-direction:column;overflow:hidden;}
  .win-bar{display:flex;align-items:center;height:42px;padding:0 14px;background:linear-gradient(180deg,#28282c 0%,#1c1c20 100%);border-bottom:1px solid #00000090;cursor:grab;}
  .win-title{flex:1;text-align:center;font-size:12px;color:#666;}
  .btns{display:flex;gap:8px}
  .btn{width:12px;height:12px;border-radius:50%;border:none;cursor:pointer;}
  .close{background:#ff5f57}
  .min{background:#febc2e}
  .max{background:#28c840}
  .win-body{padding:16px;flex:1;overflow-y:auto;background:#141416;}
  .out{white-space:pre-wrap;word-break:break-word;line-height:1.7;}
  .out.ok{color:#3ddc84}
  .out.err{color:#ff453a}
  .out.warn{color:#ffcc00}
  .out.dim{color:#48484c}
  .out.info{color:#5eaaff}
  .input-line{display:flex;align-items:baseline;line-height:1.7;}
  .input-line .pr{color:#3ddc84;font-weight:600;flex-shrink:0;}
  .input-line .pr .path{color:#5eaaff;}
  .input-line .ki{flex:1;background:transparent;border:none;outline:none;color:#fff;font:inherit;caret-color:#3ddc84;padding:0;}
  .launcher{position:fixed;bottom:20px;right:20px;padding:12px 18px;background:rgba(61,220,132,.15);border:1px solid rgba(61,220,132,.4);border-radius:14px;color:#3ddc84;font-weight:700;cursor:pointer;display:none;}
  .launcher.on{display:flex;gap:8px;align-items:center;}
  .dock{position:fixed;bottom:0;left:0;right:0;height:48px;background:#141416dd;border-top:1px solid #ffffff08;display:none;align-items:center;padding:0 20px;gap:8px;}
  .dock.on{display:flex;}
  .crt-overlay,.scanlines,.chromatic,.quick-chips,.mobile-bar{display:none;}
</style>

<!-- CSS COMPLETO EXTERNO -->
<link rel="stylesheet" href="style.css">

</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<canvas id="p" aria-hidden="true"></canvas>
<div class="crt-overlay" aria-hidden="true"></div>
<div class="scanlines" aria-hidden="true"></div>
<div class="chromatic" aria-hidden="true"></div>
<div id="wins" role="application" aria-label="Terminal workspace"></div>
<div id="dock" class="dock" aria-label="Ventanas minimizadas"></div>

<div id="quick-chips" class="quick-chips" aria-label="Comandos rápidos">
  <button class="chip" data-cmd="help">help</button>
  <button class="chip" data-cmd="about">about</button>
  <button class="chip" data-cmd="projects">projects</button>
  <button class="chip" data-cmd="social">social</button>
  <button class="chip" data-cmd="links">links</button>
  <button class="chip" data-cmd="fastfetch">fastfetch</button>
  <button class="chip" data-cmd="list">list</button>
  <button class="chip" data-cmd="history">history</button>
  <button class="chip" data-cmd="achievements">achievements</button>
  <button class="chip" data-cmd="theme">theme</button>
  <button class="chip" data-cmd="matrix">matrix</button>
  <button class="chip" data-cmd="cyberpunk">cyberpunk</button>
  <button class="chip" data-cmd="confetti">confetti</button>
  <button class="chip" data-cmd="clear">clear</button>
  <button class="chip" data-cmd="sound">sound</button>
  <button class="chip" data-cmd="reboot">reboot</button>
</div>

<div id="mobile-bar" class="mobile-bar" aria-label="Teclas virtuales">
  <button class="mb-btn mb-esc" data-action="esc" aria-label="Escape">ESC</button>
  <button class="mb-btn mb-tab" data-action="tab" aria-label="Tab">TAB</button>
  <button class="mb-btn mb-up" data-action="up" aria-label="Historial arriba">↑</button>
  <button class="mb-btn mb-down" data-action="down" aria-label="Historial abajo">↓</button>
  <button class="mb-btn mb-backspace" data-action="backspace" aria-label="Borrar">⌫</button>
  <button class="mb-btn mb-enter" data-action="enter" aria-label="Enter">ENTER ⏎</button>
</div>

<button id="launcher" class="launcher" aria-label="Abrir terminal">
  <span class="launcher-eye">◉</span>
  <span class="launcher-text">VOID</span>
  <span class="launcher-pulse"></span>
</button>
<script src="main.js"></script>
</body>
</html>
